<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenBioMini — Web Integration Demo</title>
  <style>
    :root { --bg: #090d16; --card: #111827; --primary: #3b82f6; --success: #10b981; --text: #f3f4f6; --muted: #9ca3af; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background: var(--card); border: 1px solid #1f293d; border-radius: 20px; padding: 32px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; color: #fff; }
    p.sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
    .sensor-box { width: 180px; height: 230px; margin: 0 auto 20px; background: #060911; border: 2px dashed #334155; border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .sensor-box img { width: 100%; height: 100%; object-fit: contain; }
    .btn { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #2563eb; }
    .status { margin-top: 16px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    .badge { display: inline-block; padding: 4px 10px; background: rgba(16,185,129,0.15); color: var(--success); border-radius: 99px; font-size: 0.75rem; font-weight: 700; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" id="bridgeStatus">● TESTANDO BRIDGE...</div>
    <h1>OpenBioMini Web Demo</h1>
    <p class="sub">Integração Web direta via REST API local (Porta 8080)</p>

    <div class="sensor-box" id="sensorBox">
      <span id="placeholderText" style="color:#64748b; font-size:0.9rem;">Imagem da Digital</span>
      <img id="fingerprintImg" style="display:none;" />
    </div>

    <button class="btn" id="btnScan" onclick="captureFingerprint()">
      Capturar Digital Real
    </button>

    <div class="status" id="statusText">Clique no botão e posicione o dedo no leitor</div>
  </div>

  <script>
    const API_URL = 'http://localhost:8080/api';

    async function checkBridge() {
      try {
        const res = await fetch(`${API_URL}/status`);
        const data = await res.json();
        const badge = document.getElementById('bridgeStatus');
        if (data.connected) {
          badge.innerText = `● CONECTADO (${data.model})`;
          badge.style.color = '#10b981';
        } else {
          badge.innerText = '● LEITOR DESCONECTADO';
          badge.style.color = '#f59e0b';
        }
      } catch (e) {
        const badge = document.getElementById('bridgeStatus');
        badge.innerText = '● BRIDGE OFFLINE (Inicie OpenBioMini.Bridge.exe)';
        badge.style.color = '#ef4444';
      }
    }

    async function captureFingerprint() {
      const status = document.getElementById('statusText');
      const btn = document.getElementById('btnScan');
      const img = document.getElementById('fingerprintImg');
      const placeholder = document.getElementById('placeholderText');

      btn.disabled = true;
      status.innerText = '⏳ POSICIONE O DEDO NO LEITOR (LED ACESO)...';
      status.style.color = '#60a5fa';

      try {
        const res = await fetch(`${API_URL}/scan`, { method: 'POST' });
        const data = await res.json();

        if (data.success && data.imageBase64) {
          img.src = `data:image/png;base64,${data.imageBase64}`;
          img.style.display = 'block';
          placeholder.style.display = 'none';
          status.innerText = `✓ Digital capturada com sucesso! (Qualidade: ${data.quality}%)`;
          status.style.color = '#10b981';
        } else {
          status.innerText = `✗ Erro: ${data.error || 'Falha na captura'}`;
          status.style.color = '#ef4444';
        }
      } catch (e) {
        status.innerText = '✗ Erro ao comunicar com o Bridge local em http://localhost:8080';
        status.style.color = '#ef4444';
      } finally {
        btn.disabled = false;
      }
    }

    checkBridge();
    setInterval(checkBridge, 5000);
  </script>
</body>
</html>
